name: sbom-license-gate

services:
  app:
    build: .
    image: sbom-license-gate:latest
    environment:
      PORT: 8000
    ports:
      # Host port is configurable: HOST_PORT=9090 docker compose up app
      - "${HOST_PORT:-8080}:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('PORT','8000')+'/health',timeout=2)" || exit 1
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  verify:
    image: sbom-license-gate:latest
    build: .
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_URL: http://app:8000
    command: ["sh", "scripts/verify.sh"]
    restart: "no"
